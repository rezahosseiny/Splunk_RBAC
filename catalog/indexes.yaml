# ---------------------------------------------------------------------------
# indexes.yaml — governed index register (the strategy's Data Catalog).
#
# One entry per index. data_class, compliance, domain, content, detail, and
# retention restate what the name encodes, so the register is readable on its
# own; static tests assert they agree with the name and with taxonomy.yaml, so
# a disagreement fails the build rather than sitting unnoticed.
#
# prod_source lists the production feeds that land here, from mapping.yaml.
# Owner codes come from business_units.yaml. confidence flags review effort:
#   high    follows from what the feed is; confirm in passing
#   medium  defensible, but the split could reasonably differ
#   low     needs a decision — owner_rationale says what is uncertain
#
# Status: RECOMMENDED, not approved. Authority: Reza Hosseiny.
# ---------------------------------------------------------------------------

indexes:

  - name: cim_modactions
    description: >-
      CIM modular alert action logs.
    naming_exception: vendor_mandated   # ADR-008 D3
    owner_business: sec_cyber
    owner_technical: it_observability
    confidence: high
    owner_rationale: >-
      ES machinery.
    prod_source: [cim_modactions]

  - name: ctl_cip_ics_scd_s
    description: >-
      SCADA telemetry under NERC CIP. Synthetic coverage fixture — no Class 4
      data exists in the export (ADR-008 D1). A real OT export replaces it
      through the same mapping.
    data_class: ctl          # Control
    compliance: cip
    domain: ics
    content: scd             # SCADA telemetry
    retention: _s             # Short term, 30 searchable days
    owner_business: transmission_ops
    owner_technical: operations_technology
    confidence: medium
    owner_rationale: >-
      Transmission Ops depends on it; OT operates the systems. Compliance has
      a standing interest via the cip driver.
    prod_source: [(synthetic coverage fixture)]

  - name: ctl_non_ics_hst_m
