      fixture, so CIP and non-CIP can be compared within one class (ADR-008
      D1).
    data_class: ctl          # Control
    compliance: non
    domain: ics
    content: hst             # OT historian / time series
    retention: _m             # Medium term, 365 searchable days
    owner_business: generation_ops
    owner_technical: operations_technology
    confidence: medium
    owner_rationale: >-
      Generation Ops depends on it; OT operates it.
