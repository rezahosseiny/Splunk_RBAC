# Registered codes and tiers for the governed naming schema.
#
#   [class]_[compliance]_[domain]_[content]_[optional_detail]_[retention]
#
# Class codes are STRICTLY DEFINED by the strategy. Compliance, domain, and
# content codes are DEFINABLE by the Data Governance Council; codes marked
# `source: proposed` are new in this project and need Council registration.
#
# Status: proposed (ADR-008). Authority: Reza Hosseiny.

classes:
  pub: {number: 1, name: Public,      source: strategy}
  ent: {number: 2, name: Enterprise,  source: strategy}
  ops: {number: 3, name: Operational, source: strategy}
  ctl: {number: 4, name: Control,     source: strategy}
  res: {number: 5, name: Restricted,  source: strategy}

compliance:
  non: {name: Non-regulated,            source: strategy}
  cip: {name: NERC CIP,                 source: strategy}
  pci: {name: Payment Card Industry,    source: strategy}
  hpa: {name: HIPAA,                    source: strategy}
  gdr: {name: GDPR,                     source: strategy}

domains:
  sec: {name: Security,                          source: strategy}
  ics: {name: Industrial Control Systems (OT),   source: strategy}
  inf: {name: Infrastructure (IT),               source: strategy}
  app: {name: Application / business logic,      source: strategy}

content:
  # From the strategy's own examples
  win: {name: Windows event logs,        source: strategy}
  fwl: {name: Firewall traffic,          source: strategy}
  scd: {name: SCADA telemetry,           source: strategy}
  dns: {name: DNS and DHCP,              source: strategy}
  web: {name: Web access logs,           source: strategy}
  lin: {name: Linux logs,                source: strategy}
  ndl: {name: Network device logs,       source: strategy}
  wfl: {name: Windows firewall logs,     source: strategy}
  lfl: {name: Linux firewall logs,       source: strategy}
  aud: {name: Audit trails,              source: strategy}
  bad: {name: Quarantined / rejected,    source: strategy}
  # Proposed in this project — require Data Governance Council registration
  stg: {name: Storage platform logs,             source: proposed}
  vmw: {name: Virtualization platform logs,      source: proposed}
  whm: {name: Windows host monitoring,           source: proposed}
  ocl: {name: Oracle Cloud Infrastructure,       source: proposed}
  iam: {name: Identity and access management,    source: proposed}
  edr: {name: Endpoint detection and response,   source: proposed}
  nac: {name: Network access control,            source: proposed}
  dlp: {name: Data loss prevention,              source: proposed}
  hsm: {name: Hardware security module,          source: proposed}
  col: {name: Collaboration platform logs,       source: proposed}
  itm: {name: IT service management,             source: proposed}
  hst: {name: OT historian / time series,        source: proposed}
  wea: {name: Weather and external public feeds, source: proposed}

# Retention tiers. `searchable_days` = hot + cold, and is what
# frozenTimePeriodInSecs encodes. `archive_days` is post-frozen custody
# handled outside Splunk.
retention:
  s:
    name: Short term
    hot_days: 7
    cold_days: 23
    searchable_days: 30
    archive_days: 0
    frozen_action: delete
  m:
    name: Medium term
    hot_days: 30
    cold_days: 335
    searchable_days: 365
    archive_days: 0
    frozen_action: delete
  l:
    name: Long term
    hot_days: 90
    cold_days: 1095
    searchable_days: 1185
    archive_days: 1095
    frozen_action: archive
    open_question: >-
      Strategy 2.0 is internally inconsistent for this tier. The Retention
      Suffix section says 3 years total; the retention table says 90 days
      hot + 3 years cold + 3 years frozen archive, labelled 7 years total.
      Encoded here as 1,185 searchable days (90 + 1,095) plus a 1,095-day
      archive. Needs a decision; see ADR-008 Consequences.

# Splunk's search-execution capabilities live only in pr_search_* bundles.
# Exactly the three the strategy names, and no more.
search_execution_capabilities:
  - search
  - rtsearch
  - schedule_search

# Capabilities that exist on the target release and are deliberately granted to
# NO role. Recorded so the absence is a decision on the record, and so a future
# reader does not assume an oversight.
capabilities_granted_to_no_role:
  schedule_rtsearch:
    reason: >-
      Scheduling a real-time search is the most expensive object a user can
      create, and the strategy's own content standards say to avoid real-time
      panels in favour of scheduled reports, summary indexes, and accelerated
      data models. Ad-hoc real time stays available through rtsearch and the
      rtSrchJobsQuota limit. Revisit if a use case appears.

# Sensitive tier.
#
# Every name below is VERIFIED to exist on Splunk 10.4.1 — see
# reports/capability_baseline.json, produced by tools/capability_inventory.py.
# This matters: three names the strategy gives do not exist on 10.4.1, so a
# bundle built from the strategy text verbatim would fail to deploy.
#
#   edit_indexes             -> does not exist; the real name is indexes_edit
#   edit_indexes_allinternal -> does not exist; indexes_edit covers it
#   clean_indexes            -> does not exist on 10.4.1 and has no equivalent
#
# This is the capability drift the strategy's own upgrade triage process exists
# to catch. It is a finding for Strategy 2.1, recorded in ADR-012.
#
# `addition: true` marks a capability this project adds to the strategy's
# minimum list, for review.
sensitive_capabilities:
  edit_user:                {reason: user administration}
  edit_roles_grantable:     {reason: role administration}
  edit_tokens_all:          {reason: token access}
  list_storage_passwords:   {reason: credential access}
  edit_search_server:       {reason: platform configuration}
  edit_indexer_cluster:     {reason: platform configuration}
  delete_by_keyword:        {reason: data destruction}
  indexes_edit:             {reason: index modification (strategy says edit_indexes)}
  edit_roles:               {reason: role administration, addition: true}
  admin_all_objects:        {reason: bypasses object ACLs, addition: true}
  edit_authentication_extensions:
                            {reason: authentication chain, addition: true}
  edit_storage_passwords:   {reason: credential modification, addition: true}
  edit_user_seed:           {reason: seeds the admin credential, addition: true}
  edit_upload_and_index:    {reason: writes arbitrary data to an index, addition: true}

# Capabilities the strategy names that Splunk 10.4.1 does not have. Kept so the
# absence is a recorded fact and not a silent omission.
sensitive_capabilities_absent_on_target:
  edit_indexes:             {replaced_by: indexes_edit}
  edit_indexes_allinternal: {replaced_by: indexes_edit}
  clean_indexes:            {replaced_by: null, note: no equivalent on 10.4.1}

# Destructive capabilities requiring an explicit allow-list, per the strategy's
# "destructive capability check" detection. Only roles named in the allow-list
# may hold one; the detection reports any other holder.
# run_collect and run_mcollect were dropped from both tiers on 2026-08-18. Splunk
# 10.4.1 grants them to every user and no role configuration can revoke them
# (ADR-014), so classifying them as sensitive claimed a control that does not
# exist. The exposure is real and is recorded under platform_floors; it is not
# addressed by role design. Finding for Strategy 2.1.
destructive_capabilities:
  - delete_by_keyword
  - indexes_edit
  - edit_upload_and_index

# Exactly the roles that hold a destructive capability, and no more. Listing a
# role that holds none would weaken the control: the detection could not then
# distinguish an intended holder from a role that acquired one by accident.
destructive_capability_allowlist:
  - rl_data_custodian

# Platform floors — MEASURED on the target release, not assumed.
#
# Splunk grants some capabilities and enforces some minimum quota values that no
# role configuration can change. Recorded here as facts so the tests compare
# against reality while the reality stays visible. Folding them into
# expectations.yaml instead would make every test pass and hide that two
# sensitive capabilities reach every user.
#
# See ADR-014 for the evidence and the consequences.
platform_floors:
  measured_on: Splunk 10.4.1 (build 5a009d941268)
  measured_date: 2026-08-18
  method: >-
    Read /services/authentication/current-context as each of the 15 test users
    and subtracted what the bundles grant. Revocation was attempted with
    "= disabled" on an imported bundle and on the directly held role; neither
    removed anything.

  # Held by every one of the 15 test users, and unearned — that is, present for
  # at least one role whose bundles do not grant it.
  #
  # Measuring this needed care. A first attempt intersected each user's
  # "unexpected" capabilities and found only three, because a capability that a
  # role legitimately grants does not look unexpected for that role. Comparing
  # per role against that role's own grant gives the true figure: five.
  capabilities:
    schedule_rtsearch:
      unearned_by_roles: 15
      note: >-
        ADR-013 decided to grant this to no role. That decision is not
        implementable on this release; it stands as recorded intent.
    list_all_objects:
      unearned_by_roles: 15
    run_mcollect:
      unearned_by_roles: 15
      note: >-
        Dropped from the sensitive and destructive tiers on 2026-08-18 because it
        cannot be withheld. Every user can write to a metric index they can
        reach. Not addressed by role design; a finding for Strategy 2.1.
    run_collect:
      unearned_by_roles: 14
      note: >-
        Dropped from the sensitive and destructive tiers on 2026-08-18 for the
        same reason. Every user can write to any index they can reach, which
        cuts against the principle that raw events stay immutable. Not addressed
        by role design; a finding for Strategy 2.1.
    edit_own_objects:
      unearned_by_roles: 12

  # A POSITIVE value below the floor is silently raised to it. Zero is honoured,
  # so "no real-time searches at all" is achievable while "at most four" is not.
  quota_minimums:
    srchJobsQuota: 3
    rtSrchJobsQuota: 6

  # Accepted by the write and then not stored. Setting it achieves nothing.
  unsupported_attributes:
    srchMaxTime: >-
      Not a role attribute on this release. Kept in the bundles as recorded
      intent for a release that supports it.

  # The same intent in two representations. A comparison must treat them as equal.
  equivalent_values:
    srchTimeWin:
      catalog: 0
      splunk: -1
      meaning: no limit

# Built-in roles: never modified, never imported.
builtin_roles: [admin, power, user, can_delete]

# Bundle catalog sizing targets (warn, not fail, when exceeded).
sizing_targets:
  pr_data:      {min: 8, max: 12}
  pr_search:    {min: 3, max: 4}
  pr_feat:      {min: 6, max: 10}
  pr_workspace: {min: 3, max: 6}

# Index names may skip the naming rule only under a registered exception
# class, with a justification and an owner recorded per index.
naming_exception_classes:
  vendor_mandated: >-
    The index name is resolved internally by a vendor app (Splunk
    Enterprise Security, ITSI) in correlation searches, data models, or
    macros, so renaming it breaks the app. Strategy 2.0 defines no such
    exception class; this is a recorded gap (ADR-008).

# Sourcetype and source standard, per the strategy's metadata section.
metadata_standard:
  format: tag:tag:tag
  max_tags: 5
  case: lower
