# Privilege Bundles (pr_*).
#
# A bundle grants ONE kind of access. The single-concern rule from the strategy:
#
#   pr_data_*       indexes_allowed / indexes_default / srch_filter ONLY
#   pr_search_*     search-execution capabilities + the runtime envelope
#   pr_feat_*       all other capabilities
#   pr_workspace_*  nothing; the stanza is empty and app metadata grants access
#
# A bundle must not hold an attribute belonging to another category. That rule is
# what makes any data bundle combinable with any search, feature, and workspace
# bundle.
#
# Every capability name here is VERIFIED against Splunk 10.4.1
# (reports/capability_baseline.json). Three names the strategy gives do not
# exist on that release — see the note in catalog/taxonomy.yaml.
#
# Sensitive capabilities appear only in a pr_feat_admin_* bundle, and that bundle
# carries a governance block.
#
# Status: proposed. Authority: Reza Hosseiny.

version: 1
status: proposed

# ---------------------------------------------------------------------------
# Data bundles — 12 (strategy target 8-12)
# ---------------------------------------------------------------------------
# Index patterns wildcard the RETENTION SUFFIX ONLY. One pattern per content
# code, with the trailing _s/_m/_l replaced by *.
#
# Two reasons, and they pull in opposite directions.
#
# An explicit list breaks on a retention change. All 26 governed stems are
# currently unique, so moving one index from _m to _l would silently drop it from
# every bundle that named it, and the bundle would still validate.
#
# A broad wildcard such as ops_non_inf_* over-grants. It also matches
# ops_non_inf_bad_s, the quarantine index, which holds data that failed
# onboarding and may contain misrouted sensitive content. It would hand that to
# every operational role as a side effect of a pattern nobody read closely.
#
# Wildcarding only the suffix gets both: the grant survives a retention change,
# and it still names what it grants. Quarantine needs its own pattern.
data_bundles:

  - name: pr_data_ops_infra
    description: Operational IT infrastructure telemetry. Excludes quarantine.
    indexes_allowed:
      - ops_non_inf_ndl_*
      - ops_non_inf_stg_*
      - ops_non_inf_dns_*
      - ops_non_inf_lin_*
      - ops_non_inf_win_*
      - ops_non_inf_whm_*
      - ops_non_inf_vmw_*
      - ops_non_inf_ocl_*
    indexes_default:
      - ops_non_inf_lin_*

  - name: pr_data_ops_quarantine
    description: >-
      The quarantine index alone. Separate from pr_data_ops_infra because data
      that failed onboarding can hold anything, including misrouted sensitive
      content, so access to it is a deliberate grant.
    indexes_allowed:
      - ops_non_inf_bad_*
    indexes_default:
      - ops_non_inf_bad_*

  - name: pr_data_sec_network
    description: Network security telemetry — firewall and network access control.
    indexes_allowed:
      - res_non_sec_fwl_*
      - res_non_sec_nac_*
    indexes_default:
      - res_non_sec_fwl_*

  - name: pr_data_sec_endpoint
    description: Endpoint and host security telemetry.
    indexes_allowed:
      - res_non_sec_edr_*
      - res_non_sec_dlp_*
      - res_non_sec_win_*
      - res_non_sec_lin_*
    indexes_default:
      - res_non_sec_edr_*

  - name: pr_data_sec_host_triage
    description: >-
      OS security logs together with the operational Windows logs that give them
      context. Deliberately OVERLAPS pr_data_sec_endpoint and pr_data_ops_infra:
      an analyst triaging one host needs both, and the overlap is what makes
      Splunk's union behaviour observable.
    single_role_justification: >-
      Only rl_cov_overlap. This bundle exists to make the union of overlapping
      index sets observable, which no population role would demonstrate.
    indexes_allowed:
      - res_non_sec_win_*
      - res_non_sec_lin_*
      - ops_non_inf_win_*
      - ops_non_inf_whm_*
    indexes_default:
      - res_non_sec_win_*

  - name: pr_data_identity_cloud
    description: Cloud identity providers — Entra ID, Okta, Oracle IDCS.
    indexes_allowed:
      - res_non_sec_iam_aad_*
      - res_non_sec_iam_okt_*
      - res_non_sec_iam_oci_*
    indexes_default:
      - res_non_sec_iam_aad_*

  - name: pr_data_identity_onprem
    description: >-
      On-premises identity — Active Directory and NPS/RADIUS. Disjoint from
      pr_data_identity_cloud, so a role holding both proves that the union is
      strictly larger than either bundle.
    indexes_allowed:
      - res_non_sec_iam_ad_*
      - res_non_sec_iam_nps_*
    indexes_default:
      - res_non_sec_iam_ad_*

  - name: pr_data_es_content
    description: >-
      Enterprise Security content indexes. These keep vendor-mandated names
      because ES resolves them internally.
    indexes_allowed:
      - notable
      - risk
      - threat_activity
      - gia_summary
      - endpoint_summary
      - cim_modactions
      - ers
      - dlx_kpi
      - summary
    indexes_default:
      - notable

  - name: pr_data_pci_scope
    description: >-
      PCI-scoped data. The only regulated index in the catalog, so this bundle
      carries the compliance-isolation boundary.
    indexes_allowed:
      - res_pci_sec_hsm_*
    indexes_default:
      - res_pci_sec_hsm_*

  - name: pr_data_ot_regulated
    description: NERC CIP SCADA telemetry. Class 4 Control data under a regulator.
    single_role_justification: >-
      Only rl_ot_engineer today. Keeping the regulated OT index in its own
      bundle is what allows a CIP-scoped grant to be made and revoked without
      touching unregulated OT data.
    indexes_allowed:
      - ctl_cip_ics_scd_*
    indexes_default:
      - ctl_cip_ics_scd_*

  - name: pr_data_ot_process
    description: >-
      Plant historian telemetry, Class 4 but not regulated. Separate from
      pr_data_ot_regulated so compliance isolation can be tested inside one
      data class, and not only across classes.
    single_role_justification: >-
      Only rl_ot_engineer today. It is separate from pr_data_ot_regulated so
      that compliance isolation can be tested inside one data class; a
      plant-operations read-only role would hold this bundle alone.
    indexes_allowed:
      - ctl_non_ics_hst_*
    indexes_default:
      - ctl_non_ics_hst_*

  - name: pr_data_ent_apps
    description: >-
      Enterprise application data and public reference feeds. Weather is here
      because it serves load and price forecasting, which is an application
      concern.
    single_role_justification: >-
      Only rl_it_engineer today. Business application data is held by
      application owners and business analysts, which are populations this
      test catalog does not model.
    indexes_allowed:
      - ent_non_app_col_o365_*
      - ent_non_app_itm_*
      - pub_non_app_wea_*
    indexes_default:
      - ent_non_app_itm_*

# ---------------------------------------------------------------------------
# Search bundles — 4 (strategy target 3-4)
# ---------------------------------------------------------------------------
# Each holds the search-execution capabilities together with the runtime limits
# that govern them, because the two only make sense read together.
search_bundles:

  - name: pr_search_basic
    description: Standard analyst envelope. No real time and no scheduling.
    capabilities: [search]
    envelope:
      srchTimeWin: 2592000        # 30 days
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600

  - name: pr_search_advanced
    description: >-
      Power-user envelope with scheduling and ad-hoc real time. It does NOT grant
      schedule_rtsearch: a scheduled real-time search is the most expensive
      object a user can create, and the strategy's content standards discourage
      real-time panels. rtSrchJobsQuota still bounds ad-hoc real-time use.
    capabilities: [search, rtsearch, schedule_search]
    envelope:
      srchTimeWin: 0              # no limit
      srchJobsQuota: 10
      rtSrchJobsQuota: 4
      srchDiskQuota: 2000
      srchMaxTime: 0              # no limit

  - name: pr_search_constrained
    description: >-
      The default for a service account. Narrow window, no scheduling, no real
      time.
    single_role_justification: >-
      Only rl_svc_siem_ingest today. The strategy makes this the default
      envelope for every service account, so each new service account is a
      further holder.
    capabilities: [search]
    envelope:
      srchTimeWin: 86400          # 24 hours
      srchJobsQuota: 2
      rtSrchJobsQuota: 0
      srchDiskQuota: 100
      srchMaxTime: 600

  - name: pr_search_burst
    description: >-
      Extra concurrency for a short investigation, with a SMALLER disk quota
      than pr_search_basic. The asymmetry is deliberate: a role holding both
      bundles must end with 20 jobs and 500 MB, so the test proves Splunk takes
      the maximum of each attribute separately, and not simply the values of the
      more generous bundle.
    single_role_justification: >-
      Only rl_cov_search. This bundle exists to make the per-attribute quota
      maximum observable, and its disk quota is deliberately lower than
      pr_search_basic, which no population role should hold.
    capabilities: [search]
    envelope:
      srchTimeWin: 604800         # 7 days
      srchJobsQuota: 20
      rtSrchJobsQuota: 0
      srchDiskQuota: 200
      srchMaxTime: 1800

# ---------------------------------------------------------------------------
# Feature bundles — 9 (strategy target 6-10)
# ---------------------------------------------------------------------------
feature_bundles:

  - name: pr_feat_baseline
    description: >-
      What every authenticated Tri-State user holds. This is the maintained
      equivalent of the built-in user role, which the strategy forbids importing.
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead

  - name: pr_feat_dashboards
    description: Build and share dashboards and reports.
    capabilities:
      - edit_own_objects
      - embed_report

  - name: pr_feat_alerting
    description: Create and tune scheduled alerts.
    single_role_justification: >-
      Only rl_soc_t2 today. Alert authoring belongs to any content-authoring
      role, which this catalog models once.
    capabilities:
      - edit_search_schedule_window
      - edit_search_schedule_priority

  - name: pr_feat_acceleration
    description: Accelerate reports and data models.
    single_role_justification: >-
      Only rl_soc_t2 today. Acceleration is a power-user grant that any
      content-authoring role would take.
    capabilities:
      - accelerate_search

  - name: pr_feat_export
    description: >-
      Write search results to a file. Separate from pr_feat_dashboards because
      this is a data-egress path: it deserves its own grant and its own audit
      line, even though it is not in the sensitive tier.
    capabilities:
      - output_file

  - name: pr_feat_rbac_visibility
    description: >-
      Read-only sight of the role and user catalog, which an access review
      needs. Read-only, so not sensitive.
    single_role_justification: >-
      Only rl_compliance_auditor. Read-only sight of the role catalog is what
      an access review needs, and access review is a compliance function by
      design rather than by accident.
    capabilities:
      - list_all_roles
      - list_all_users

  - name: pr_feat_investigate
    description: >-
      Read a local file into a search during an investigation, for example an
      indicator list, and read configuration through REST. Neither capability is
      in the sensitive tier: input_file reads into a search and does not write to
      an index, which edit_upload_and_index does and which lives in
      pr_feat_admin_data.
    single_role_justification: >-
      Only rl_soc_t2 today. Detection engineering is the activity that needs it;
      a threat-intelligence role would be the second holder.
    capabilities:
      - input_file
      - rest_properties_get

  # ---- Sensitive tier ----------------------------------------------------
  # A sensitive capability may exist ONLY in a pr_feat_admin_* bundle, and that
  # bundle must carry a governance block. Two admin bundles rather than one:
  # platform administration and data destruction are different duties, and
  # separating them means neither role alone can both change the platform and
  # destroy the evidence.

  - name: pr_feat_admin_platform
    description: Platform administration. SENSITIVE.
    sensitive: true
    single_role_justification: >-
      Only rl_platform_admin, by design. See pr_feat_admin_data — the pair
      exists to be held separately.
    capabilities:
      - edit_user
      - edit_roles
      - edit_roles_grantable
      - edit_search_server
      - list_storage_passwords
      - admin_all_objects
    governance:
      time_bounded: true
      max_standing_duration_days: 90
      dual_approval: true
      session_logging: _audit
      recertification: quarterly

  - name: pr_feat_admin_data
    description: >-
      Index modification and data destruction. SENSITIVE. Held separately from
      pr_feat_admin_platform so that no single role can both reconfigure the
      platform and delete the record of it.

      It does not grant run_collect: Splunk 10.4.1 grants that to every user
      regardless of role, so granting it here would imply a control that does not
      exist (ADR-014).
    sensitive: true
    single_role_justification: >-
      Only rl_data_custodian, by design. One holder is the point: separating
      data destruction from platform administration is what stops a single
      account reconfiguring the platform and destroying the record.
    capabilities:
      - indexes_edit
      - delete_by_keyword
      - edit_upload_and_index
    governance:
      time_bounded: true
      max_standing_duration_days: 30
      dual_approval: true
      session_logging: _audit
      recertification: quarterly

# ---------------------------------------------------------------------------
# Workspace bundles — 4 (strategy target 3-6)
# ---------------------------------------------------------------------------
# Each stanza is EMPTY in authorize.conf. It grants no index, no capability, and
# no quota. It is a named handle that each app's metadata/local.meta references.
# A workspace is therefore a two-file construct, and both halves must exist.
workspace_bundles:

  - name: pr_workspace_soc
    description: Security operations workspace.
    apps: [tristate_soc_workspace]

  - name: pr_workspace_itops
    description: IT and network operations workspace.
    apps: [tristate_itops_workspace]

  - name: pr_workspace_ot
    description: Operations Technology workspace.
    single_role_justification: >-
      Only rl_ot_engineer. As above.
    apps: [tristate_ot_workspace]

  - name: pr_workspace_audit
    description: Compliance and audit reviewer workspace.
    single_role_justification: >-
      Only rl_compliance_auditor. A workspace serves one population by nature;
      that is what a workspace is.
    apps: [tristate_audit_workspace]
