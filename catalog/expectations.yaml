# Expectations — an INDEPENDENT statement of what each Business Role must and
# must not be able to do.
#
# HOW THIS FILE IS WRITTEN, AND WHY IT MATTERS
#
# A person writes this file by reasoning from each role's purpose. No tool
# generates it, and no tool may ever generate it.
#
# The reason is the whole point of the file. The behavioural tests compare live
# Splunk behaviour against these values. If a tool derived them from the same
# bundle definitions the generator reads, then a fault in the generator would
# appear in both, the comparison would agree with the fault, and the suite would
# pass while proving nothing.
#
# A static test compares these values against the sets computed from the
# bundles. A disagreement means one of two things, and both are worth knowing:
# either the composition is wrong, or the intent recorded here is wrong. Resolve
# it as a decision. Never edit this file to match a computed value without
# understanding which of the two was mistaken.
#
# `must_not_reach` names the boundaries that carry meaning for the role. The
# tests also check the full complement of `allowed_indexes`, so an index absent
# from both lists is still denied and still tested. The named ones are the cases
# where a wrong answer would be a control failure and not merely a mistake.
#
# Status: proposed. Authority: Reza Hosseiny.

version: 1
status: proposed

workspace_apps_all:
  - tristate_soc_workspace
  - tristate_itops_workspace
  - tristate_ot_workspace
  - tristate_audit_workspace

expectations:

  # =========================================================================
  # Population roles
  # =========================================================================

  rl_soc_t1:
    intent: >-
      Triage security alerts. Needs security telemetry and the Enterprise
      Security content, plus the operational estate for context. Must not see
      identity data or PCI scope: those belong to the second line and to
      compliance.
    allowed_indexes:
      - res_non_sec_fwl_l
      - res_non_sec_nac_m
      - res_non_sec_edr_l
      - res_non_sec_dlp_l
      - res_non_sec_win_l
      - res_non_sec_lin_l
      - notable
      - risk
      - threat_activity
      - gia_summary
      - endpoint_summary
      - cim_modactions
      - ers
      - dlx_kpi
      - summary
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach:
      - res_pci_sec_hsm_l          # compliance isolation: PCI is out of scope
      - res_non_sec_iam_aad_l      # identity belongs to the second line
      - res_non_sec_iam_ad_m
      - res_non_sec_iam_okt_l
      - res_non_sec_iam_oci_l
      - res_non_sec_iam_nps_l
      - ctl_cip_ics_scd_s          # OT isolation
      - ctl_non_ics_hst_m
      - ops_non_inf_bad_s          # quarantine needs a deliberate grant
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_soc_workspace]
    hidden_apps: [tristate_itops_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_soc_t2:
    intent: >-
      Investigate and engineer detections. Adds identity data across every
      provider, PCI scope, a wider runtime envelope, and content authoring.
      Reaches the HSM logs because a payment or cryptographic incident needs
      them, and an exception for every such incident would make the exception
      routine. Still must not see OT data.
    allowed_indexes:
      - res_non_sec_fwl_l
      - res_non_sec_nac_m
      - res_non_sec_edr_l
      - res_non_sec_dlp_l
      - res_non_sec_win_l
      - res_non_sec_lin_l
      - res_non_sec_iam_aad_l
      - res_non_sec_iam_okt_l
      - res_non_sec_iam_oci_l
      - res_non_sec_iam_ad_m
      - res_non_sec_iam_nps_l
      - res_pci_sec_hsm_l
      - notable
      - risk
      - threat_activity
      - gia_summary
      - endpoint_summary
      - cim_modactions
      - ers
      - dlx_kpi
      - summary
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach:
      - ctl_cip_ics_scd_s          # OT isolation, from the security direction
      - ctl_non_ics_hst_m
      - ops_non_inf_bad_s
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
      - rtsearch
      - schedule_search
      - edit_own_objects
      - embed_report
      - edit_search_schedule_window
      - edit_search_schedule_priority
      - accelerate_search
      - input_file
      - rest_properties_get
    quotas:
      srchTimeWin: 0
      srchJobsQuota: 10
      rtSrchJobsQuota: 4
      srchDiskQuota: 2000
      srchMaxTime: 0
    visible_apps: [tristate_soc_workspace]
    hidden_apps: [tristate_itops_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_it_engineer:
    intent: >-
      Troubleshoot the IT estate and build dashboards. Needs the operational
      estate and the business applications. Must not reach any Class 5 index:
      this is the sensitivity wall between operational and restricted data.
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
      - ent_non_app_col_o365_m
      - ent_non_app_itm_m
      - pub_non_app_wea_s
    must_not_reach:
      - res_non_sec_win_l          # sensitivity wall: Class 3 role, Class 5 data
      - res_non_sec_lin_l
      - res_non_sec_fwl_l
      - res_non_sec_edr_l
      - res_non_sec_iam_aad_l
      - res_pci_sec_hsm_l
      - ctl_cip_ics_scd_s
      - notable                    # ES content belongs to the SOC
      - ops_non_inf_bad_s
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
      - rtsearch
      - schedule_search
      - edit_own_objects
      - embed_report
    quotas:
      srchTimeWin: 0
      srchJobsQuota: 10
      rtSrchJobsQuota: 4
      srchDiskQuota: 2000
      srchMaxTime: 0
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_noc_operator:
    intent: >-
      Watch the operational estate. The narrowest population role, and the
      reference point for every sensitivity-wall test. Reaches the operational
      estate and nothing else.
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach:
      - ops_non_inf_bad_s          # inside the same class, so the wildcard risk
      - res_non_sec_win_l
      - res_non_sec_fwl_l
      - res_pci_sec_hsm_l
      - ctl_cip_ics_scd_s
      - ctl_non_ics_hst_m
      - notable
      - ent_non_app_itm_m
      - pub_non_app_wea_s
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_ot_engineer:
    intent: >-
      Operate and troubleshoot OT systems. Needs both Class 4 index sets and the
      operational estate for network context. Must not reach any Class 5 index.
      This role carries the OT isolation test from the OT direction.
    allowed_indexes:
      - ctl_cip_ics_scd_s
      - ctl_non_ics_hst_m
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach:
      - res_non_sec_fwl_l          # OT isolation: no security telemetry
      - res_non_sec_edr_l
      - res_non_sec_iam_aad_l
      - res_pci_sec_hsm_l
      - notable
      - ent_non_app_col_o365_m
      - ops_non_inf_bad_s
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
      - edit_own_objects
      - embed_report
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_ot_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_itops_workspace, tristate_audit_workspace]

  rl_compliance_auditor:
    intent: >-
      Review access and produce evidence. Needs PCI scope, the identity trails an
      access review depends on, the ES content, and read-only sight of the role
      catalog. Must not reach the operational estate: a reviewer sees evidence,
      not the whole platform.
    allowed_indexes:
      - res_pci_sec_hsm_l
      - res_non_sec_iam_aad_l
      - res_non_sec_iam_okt_l
      - res_non_sec_iam_oci_l
      - res_non_sec_iam_ad_m
      - res_non_sec_iam_nps_l
      - notable
      - risk
      - threat_activity
      - gia_summary
      - endpoint_summary
      - cim_modactions
      - ers
      - dlx_kpi
      - summary
    must_not_reach:
      - ops_non_inf_ndl_m          # not the operational estate
      - ops_non_inf_lin_m
      - ops_non_inf_bad_s
      - res_non_sec_fwl_l          # not the security telemetry itself
      - res_non_sec_edr_l
      - res_non_sec_win_l
      - ctl_cip_ics_scd_s
      - ent_non_app_col_o365_m
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
      - list_all_roles
      - list_all_users
      - output_file
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_audit_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_itops_workspace, tristate_ot_workspace]

  rl_platform_admin:
    intent: >-
      Administer the platform. A sensitive role chain. Holds the quarantine
      index, because triage of failed onboarding is a platform duty. Must NOT
      hold any destructive capability: data removal is a different duty.
    sensitive: true
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
      - ops_non_inf_bad_s
    must_not_reach:
      - res_non_sec_fwl_l          # administration is not a data grant
      - res_non_sec_iam_aad_l
      - res_pci_sec_hsm_l
      - ctl_cip_ics_scd_s
      - notable
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
      - rtsearch
      - schedule_search
      - edit_user
      - edit_roles
      - edit_roles_grantable
      - edit_search_server
      - list_storage_passwords
      - admin_all_objects
    must_not_hold:
      - delete_by_keyword          # separation of duties from rl_data_custodian
      - indexes_edit
      - run_collect
      - edit_upload_and_index
    quotas:
      srchTimeWin: 0
      srchJobsQuota: 10
      rtSrchJobsQuota: 4
      srchDiskQuota: 2000
      srchMaxTime: 0
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_data_custodian:
    intent: >-
      Manage the index lifecycle and remove data when required. A sensitive role
      chain, and the only holder of the destructive capabilities. Must NOT hold
      user or role administration, so it cannot grant itself anything.
    sensitive: true
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
      - ops_non_inf_bad_s
    must_not_reach:
      - res_non_sec_fwl_l
      - res_pci_sec_hsm_l
      - ctl_cip_ics_scd_s
      - notable
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
      - rtsearch
      - schedule_search
      - indexes_edit
      - delete_by_keyword
      - run_collect
      - edit_upload_and_index
    must_not_hold:
      - edit_user                  # separation of duties from rl_platform_admin
      - edit_roles
      - edit_roles_grantable
      - list_storage_passwords
      - admin_all_objects
    quotas:
      srchTimeWin: 0
      srchJobsQuota: 10
      rtSrchJobsQuota: 4
      srchDiskQuota: 2000
      srchMaxTime: 0
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_svc_siem_ingest:
    intent: >-
      Forward security telemetry to a downstream SIEM. A service account, so it
      uses the constrained envelope and has no workspace at all.
    service_account: true
    allowed_indexes:
      - res_non_sec_fwl_l
      - res_non_sec_nac_m
      - res_non_sec_edr_l
      - res_non_sec_dlp_l
      - res_non_sec_win_l
      - res_non_sec_lin_l
    must_not_reach:
      - ops_non_inf_ndl_m
      - ops_non_inf_bad_s
      - res_non_sec_iam_aad_l
      - res_pci_sec_hsm_l
      - ctl_cip_ics_scd_s
      - notable
    capabilities:
      - change_own_password
      - get_metadata
      - get_typeahead
      - search
    quotas:
      srchTimeWin: 86400
      srchJobsQuota: 2
      rtSrchJobsQuota: 0
      srchDiskQuota: 100
      srchMaxTime: 600
    visible_apps: []
    hidden_apps:
      - tristate_soc_workspace
      - tristate_itops_workspace
      - tristate_ot_workspace
      - tristate_audit_workspace

  # =========================================================================
  # Coverage roles
  #
  # rl_cov_base is the control. For each other coverage role, exactly one of the
  # four result sets below must differ from the control, and the other three must
  # match it exactly. That is the property under test, and it is why the values
  # are repeated in full rather than expressed as a difference.
  # =========================================================================

  rl_cov_base:
    intent: The control for the differential pairs.
    purpose: coverage
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach: [ops_non_inf_bad_s, res_non_sec_fwl_l, ctl_cip_ics_scd_s, notable]
    capabilities: [change_own_password, get_metadata, get_typeahead, search]
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_cov_data:
    intent: >-
      Differs from the control by one data bundle. The index set must grow by
      three cloud identity indexes. Everything else must be identical.
    purpose: coverage
    differs_from: rl_cov_base
    differs_in: allowed_indexes
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
      - res_non_sec_iam_aad_l
      - res_non_sec_iam_okt_l
      - res_non_sec_iam_oci_l
    must_not_reach: [res_non_sec_iam_ad_m, res_non_sec_iam_nps_l, ops_non_inf_bad_s]
    capabilities: [change_own_password, get_metadata, get_typeahead, search]
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_cov_search:
    intent: >-
      Differs from the control by one search bundle, and holds two search bundles
      at once. The quotas must be the MAXIMUM of each attribute taken separately:
      20 jobs from pr_search_burst, and 500 MB from pr_search_basic. Neither
      bundle supplies both values, so a wrong rule cannot give the right answer.
    purpose: coverage
    differs_from: rl_cov_base
    differs_in: quotas
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach: [ops_non_inf_bad_s, res_non_sec_fwl_l]
    capabilities: [change_own_password, get_metadata, get_typeahead, search]
    quotas:
      srchTimeWin: 2592000       # max(2592000, 604800)
      srchJobsQuota: 20          # max(5, 20)      from pr_search_burst
      rtSrchJobsQuota: 0         # max(0, 0)
      srchDiskQuota: 500         # max(500, 200)   from pr_search_basic
      srchMaxTime: 3600          # max(3600, 1800)
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_cov_feat:
    intent: >-
      Differs from the control by one feature bundle. The capability set must gain
      output_file and nothing else. Everything else must be identical.
    purpose: coverage
    differs_from: rl_cov_base
    differs_in: capabilities
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach: [ops_non_inf_bad_s, res_non_sec_fwl_l]
    capabilities: [change_own_password, get_metadata, get_typeahead, search, output_file]
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]

  rl_cov_workspace:
    intent: >-
      Differs from the control by one workspace bundle. The SOC workspace must
      become visible. The index set, the capability set, and the quotas must all
      be identical, which is what proves an empty stanza grants nothing.
    purpose: coverage
    differs_from: rl_cov_base
    differs_in: visible_apps
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
    must_not_reach: [ops_non_inf_bad_s, res_non_sec_fwl_l]
    capabilities: [change_own_password, get_metadata, get_typeahead, search]
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_itops_workspace, tristate_soc_workspace]
    hidden_apps: [tristate_ot_workspace, tristate_audit_workspace]

  rl_cov_overlap:
    intent: >-
      Holds three data bundles whose index sets overlap. The result must be the
      union of all three, which is twelve indexes. If Splunk let the last bundle
      win the answer would be four, and if the first won it would be eight, so
      the three outcomes are distinguishable.
    purpose: coverage
    allowed_indexes:
      - ops_non_inf_ndl_m
      - ops_non_inf_stg_m
      - ops_non_inf_dns_m
      - ops_non_inf_lin_m
      - ops_non_inf_win_m
      - ops_non_inf_whm_s
      - ops_non_inf_vmw_s
      - ops_non_inf_ocl_m
      - res_non_sec_edr_l
      - res_non_sec_dlp_l
      - res_non_sec_win_l
      - res_non_sec_lin_l
    must_not_reach: [ops_non_inf_bad_s, res_non_sec_fwl_l, res_pci_sec_hsm_l]
    capabilities: [change_own_password, get_metadata, get_typeahead, search]
    quotas:
      srchTimeWin: 2592000
      srchJobsQuota: 5
      rtSrchJobsQuota: 0
      srchDiskQuota: 500
      srchMaxTime: 3600
    visible_apps: [tristate_itops_workspace]
    hidden_apps: [tristate_soc_workspace, tristate_ot_workspace, tristate_audit_workspace]
