# Test users — one for each Business Role, and no more.
#
# These stand in for the identity provider on the test instance. Production uses
# SAML, with one group GRP_splunk_<rl_role> mapped to each Business Role
# (ADR-003). The generator renders that mapping as a template, and a static test
# checks its shape. Live SAML behaviour is not tested here.
#
# One user for each role is what makes the one-role-per-user rule testable: a
# behavioural test reads each user's role list and asserts that it holds exactly
# one entry.
#
# Passwords are generated at deploy time into config/test_user_credentials.json,
# which is gitignored. No password appears in this file or anywhere in version
# control.
#
# Status: proposed. Authority: Reza Hosseiny.

version: 1
status: proposed

# Prefix for every test account, so a test user is recognisable at a glance and
# a teardown can never mistake a real account for one of these.
username_prefix: t_

users:

  # ---- Population roles -------------------------------------------------
